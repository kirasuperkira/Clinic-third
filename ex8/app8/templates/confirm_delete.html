<!DOCTYPE html>
<html>
<head>
    <title>Удаление пациента</title>
</head>
<body>
    <h1>Подтверждение удаления</h1>
    <p>Вы уверены, что хотите удалить пациента {{ patient.last_name }} {{ patient.first_name }}?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit">Удалить</button>
    </form>
    <a href="{% url 'patient_detail' patient.id %}">Отмена</a>
</body>
</html>
